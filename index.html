<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DMP3 AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- A-Frame + MindAR (CORRECT script tags) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    .hidden { display: none !important; }
    canvas.a-canvas, .a-canvas { touch-action: none !important; }

    /* Round action button */
    .btn {
      position: fixed; bottom: 20px; left: 20px;
      width: 70px; height: 70px; border-radius: 50%;
      background: #1e5df8; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      cursor: pointer; z-index: 1000; user-select: none; pointer-events: auto;
    }
    .btn svg { width: 34px; height: 34px; fill: #fff; }
    .btn:active { transform: scale(0.96); }

    /* CTA pill (bottom center) */
    .cta-pill {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
      background: #1e5df8; color: #fff; border-radius: 30px;
      padding: 14px 22px; font-size: 16px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      z-index: 1000; cursor: pointer; pointer-events: auto; user-select: none;
      white-space: nowrap;
    }

    /* Restart pills (top-left) – appear only after media starts */
    #restartVideoBtn_p1, #restartVoiceBtn_p2 {
      position: fixed; top: 20px; left: 20px;
      background: #1e5df8; color: #fff; border-radius: 30px;
      padding: 10px 14px; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      z-index: 1000; cursor: pointer; pointer-events: auto; user-select: none;
      white-space: nowrap;
    }

    /* Reset model (bottom-right) */
    #resetModelBtn_p2 {
      position: fixed; bottom: 20px; right: 20px;
      background: #1e5df8; color: #fff; border-radius: 30px;
      padding: 10px 14px; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      z-index: 1000; cursor: pointer; pointer-events: auto; user-select: none;
      white-space: nowrap;
    }

    /* Close (top-right) */
    #closeBtn {
      position: fixed; top: 20px; right: 20px;
      width: 55px; height: 55px; line-height: 55px; text-align: center;
      background: rgba(0,0,0,0.7); color: #fff; border-radius: 50%;
      font-size: 26px; z-index: 1000; cursor: pointer; pointer-events: auto;
    }

    #audioOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 22px; z-index: 2000; cursor: pointer; pointer-events: auto; user-select: none;
      padding: 24px; text-align: center;
    }
  </style>
</head>

<body>

  <!-- =================== AR SCENE =================== -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.15">

    <!-- Preload assets -->
    <a-assets timeout="45000">
      <!-- Poster 1 video -->
      <video id="videoAsset" src="./assets/video.mp4" preload="auto" playsinline crossorigin="anonymous"></video>

      <!-- Poster 2 model -->
      <a-asset-item id="modelAsset" src="./assets/quantum-model-shaded.glb" crossorigin="anonymous"></a-asset-item>

      <!-- Poster 2 voiceover -->
      <audio id="voiceAsset" src="./assets/quantum-voiceover.mp3" preload="auto" crossorigin="anonymous"></audio>
    </a-assets>

    <!-- ✨ Lighting: Hemi + Key + Rim (balanced, bright, natural) -->
    <a-entity light="type: hemisphere; intensity: 0.9; color: #ffffff; groundColor: #666666"></a-entity>
    <a-entity light="type: directional; intensity: 1.2; castShadow: false" position="0.5 1 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.6; castShadow: false" position="-0.8 0.8 -0.6"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Poster 1 (video plane) -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetP1">
      <a-video id="arVideo" src="#videoAsset" width="1.6" height="0.9" position="0 0 0" visible="false"></a-video>
    </a-entity>

    <!-- Poster 2 (your model position + gestures) -->
    <a-entity mindar-image-target="targetIndex: 1" id="targetP2">
      <a-entity id="modelRig"
                position="0 -0.85 0.05"
                rotation="0 0 0"
                scale="1 1 1"
                visible="false"
                touch-transform="minScale:0.2; maxScale:3; rotateFactor:0.01">
        <a-entity id="modelEntity" gltf-model="#modelAsset"></a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- =================== UI =================== -->
  <!-- Poster 1 -->
  <div id="playVideoCTA_p1" class="cta-pill hidden">Play video</div>
  <div id="restartVideoBtn_p1" class="hidden">Restart video</div>
  <div id="togglePlayPauseBtn_p1" class="btn hidden" role="button" aria-label="Play/Pause video">
    <svg id="iconPlay_p1" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p1" viewBox="0 0 100 100" style="display:none;">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>

  <!-- Poster 2 voiceover -->
  <div id="tellMeMoreBtn_p2" class="cta-pill hidden">Tell me more</div>
  <div id="togglePlayPauseBtn_p2" class="btn hidden" role="button" aria-label="Play/Pause audio">
    <svg id="iconPlay_p2" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p2" viewBox="0 0 100 100" style="display:none;">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>
  <div id="restartVoiceBtn_p2" class="hidden">Restart audio</div>

  <!-- Reset model (bottom-right) -->
  <div id="resetModelBtn_p2" class="hidden">Reset model</div>

  <!-- Shared -->
  <div id="closeBtn" class="hidden">✕</div>
  <div id="audioOverlay">Tap to Enable Sound</div>

  <!-- Lightweight loading indicator shown after overlay tap until AR is ready -->
<div id="loadingIndicator"
     style="position:fixed; inset:0; display:none;
            background:#000; color:#fff;
            font-size:20px; z-index:1500;
            align-items:center; justify-content:center;">
  Loading AR…
</div>
  
  <!-- =================== GESTURE COMPONENT (rotate + pinch) =================== -->
  <script>
    /* Touch gestures: 1‑finger rotate, 2‑finger pinch‑to‑scale */
    AFRAME.registerComponent('touch-transform', {
      schema:{ rotateFactor:{default:0.01}, minScale:{default:0.2}, maxScale:{default:3} },
      init(){
        this.isDragging=false;
        this.prevX=0; this.prevY=0;
        this.pinchStartDist=null;
        this.startScale=this.el.object3D.scale.x;

        this._boundStart=e=>this._start(e);
        this._boundMove =e=>this._move(e);
        this._boundEnd  =e=>this._end(e);

        window.addEventListener('touchstart',this._boundStart,{passive:false});
        window.addEventListener('touchmove', this._boundMove, {passive:false});
        window.addEventListener('touchend',  this._boundEnd,  {passive:false});
        window.addEventListener('touchcancel',this._boundEnd,{passive:false});
      },
      remove(){
        window.removeEventListener('touchstart',this._boundStart);
        window.removeEventListener('touchmove', this._boundMove);
        window.removeEventListener('touchend',  this._boundEnd);
        window.removeEventListener('touchcancel',this._boundEnd);
      },
      _visible(){ return this.el.object3D.visible; },
      _isUI(t){
        return t && t.closest && t.closest(
          '.btn, .cta-pill, #closeBtn, #audioOverlay, #restartVideoBtn_p1, #restartVoiceBtn_p2, #resetModelBtn_p2'
        );
      },
      _dist(t0,t1){ const dx=t0.clientX-t1.clientX, dy=t0.clientY-t1.clientY; return Math.hypot(dx,dy); },

      _start(e){
        if(!this._visible() || this._isUI(e.target)) return;
        if(e.touches.length===1){
          this.isDragging=true;
          this.prevX=e.touches[0].clientX;
          this.prevY=e.touches[0].clientY;
          e.preventDefault();
        } else if(e.touches.length===2){
          this.pinchStartDist=this._dist(e.touches[0],e.touches[1]);
          this.startScale=this.el.object3D.scale.x;
          e.preventDefault();
        }
      },
      _move(e){
        if(!this._visible() || this._isUI(e.target)) return;

        // Pinch to scale
        if(e.touches.length===2 && this.pinchStartDist){
          const d=this._dist(e.touches[0],e.touches[1]);
          let s=this.startScale*(d/this.pinchStartDist);
          s=Math.min(Math.max(s,this.data.minScale),this.data.maxScale);
          this.el.object3D.scale.set(s,s,s);
          e.preventDefault();
          return;
        }

        // 1‑finger rotate (yaw + limited pitch)
        if(this.isDragging && e.touches.length===1){
          const x=e.touches[0].clientX, y=e.touches[0].clientY;
          const dx=x-this.prevX, dy=y-this.prevY;
          this.prevX=x; this.prevY=y;

          const rot=this.el.object3D.rotation;
          rot.y += dx * this.data.rotateFactor;  // yaw
          rot.x += dy * this.data.rotateFactor;  // pitch
          const maxX=Math.PI/2, minX=-Math.PI/2; // clamp ±90°
          if(rot.x>maxX) rot.x=maxX;
          if(rot.x<minX) rot.x=minX;

          e.preventDefault();
        }
      },
      _end(e){
        if(!this._visible()) return;
        if(e.touches.length<2){
          this.pinchStartDist=null;
          this.startScale=this.el.object3D.scale.x;
        }
        if(e.touches.length===0){
          this.isDragging=false;
        }
      }
    });
  </script>

  <!-- =================== MAIN SCRIPT =================== -->
  <script>
    window.onload = () => {
      /* ELEMENTS */
      const video   = document.querySelector('#videoAsset');
      const arVideo = document.querySelector('#arVideo');

      const voice   = document.querySelector('#voiceAsset');

      const modelRig = document.querySelector('#modelRig');
      const targetP1 = document.querySelector('#targetP1');
      const targetP2 = document.querySelector('#targetP2');

      const playCTA     = document.getElementById('playVideoCTA_p1');
      const playBtnP1   = document.getElementById('togglePlayPauseBtn_p1');
      const iconPlayP1  = document.getElementById('iconPlay_p1');
      const iconPauseP1 = document.getElementById('iconPause_p1');

      const restartVideoBtn = document.getElementById('restartVideoBtn_p1');

      const tellCTA     = document.getElementById('tellMeMoreBtn_p2');
      const playBtnP2   = document.getElementById('togglePlayPauseBtn_p2');
      const iconPlayP2  = document.getElementById('iconPlay_p2');
      const iconPauseP2 = document.getElementById('iconPause_p2');

      const restartVoiceBtn = document.getElementById('restartVoiceBtn_p2');
      const resetModelBtn   = document.getElementById('resetModelBtn_p2');

      const closeBtn   = document.getElementById('closeBtn');
      const audioOverlay = document.getElementById('audioOverlay');

      const show = el => el && el.classList.remove('hidden');
      const hide = el => el && el.classList.add('hidden');

      /* Capture defaults for Reset (Poster 2) */
      let defaultRigScale = null;
      let defaultRigRot   = null;

/* === Audio unlock (SAFE + GOOD UX) === */
audioOverlay.addEventListener('click', async () => {
  // Immediately hide overlay (UX feedback) and show loader
  audioOverlay.style.display = 'none';
  const loadingEl = document.getElementById('loadingIndicator');
  if (loadingEl) loadingEl.style.display = 'flex';

  // 1) Unmute your media (no playback here)
  if (video) video.muted = false;
  if (voice) voice.muted = false;

  // 2) Create/resume AudioContext (iOS requirement)
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      if (!window._audioCtx) window._audioCtx = new AC();
      if (window._audioCtx.state === 'suspended') {
        await window._audioCtx.resume();
      }
    }
  } catch (e) {
    // non-fatal
  }

  // 3) Play 1-sample silent buffer to satisfy autoplay policies without using your media
  try {
    const ctx = window._audioCtx;
    if (ctx) {
      const silentBuffer = ctx.createBuffer(1, 1, 22050); // 1 sample of silence
      const source = ctx.createBufferSource();
      source.buffer = silentBuffer;
      source.connect(ctx.destination);
      source.start(0);
    }
  } catch (e) {
    console.warn('Silent buffer unlock failed (non-fatal):', e);
  }

  // 4) Defensive: ensure real media are paused & reset to 0 (if safe)
  try {
    if (video) {
      video.pause();
      if (!isNaN(video.duration)) video.currentTime = 0;
    }
    if (voice) {
      voice.pause();
      if (!isNaN(voice.duration)) voice.currentTime = 0;
    }
  } catch (e) {
    // non-fatal
  }

  // 5) Hide loader when AR is ready (first AR-ready event)
  const scene = document.querySelector('a-scene');
  const hideLoader = () => { if (loadingEl) loadingEl.style.display = 'none'; };
  if (scene && scene.hasLoaded) {
    // MindAR may fire arReady after scene loaded; listen for it
    scene.addEventListener('arReady', hideLoader, { once: true });
  } else if (scene) {
    scene.addEventListener('loaded', () => {
      scene.addEventListener('arReady', hideLoader, { once: true });
    }, { once: true });
  } else {
    // Fallback: remove after 3.5s if scene isn’t found (shouldn’t happen)
    setTimeout(hideLoader, 3500);
  }
});
      
      /* ===== Poster 1 (Video) ===== */
      const updateP1 = () => {
        const paused = video.paused;
        iconPlayP1.style.display = paused ? 'block' : 'none';
        iconPauseP1.style.display = paused ? 'none' : 'block';
      };

      targetP1.addEventListener('targetFound', () => {
        arVideo.setAttribute('visible', true);

        // Show only Play CTA initially; DO NOT show Restart yet
        show(playCTA);
        hide(playBtnP1);
        hide(restartVideoBtn);  // appears only after first play

        show(closeBtn);

        // Hide P2 UI
        hide(tellCTA); hide(playBtnP2); hide(restartVoiceBtn); hide(resetModelBtn);
      });

      targetP1.addEventListener('targetLost', () => {
        video.pause();
        arVideo.setAttribute('visible', false);
        hide(playCTA);
        hide(playBtnP1);
        hide(restartVideoBtn);
        hide(closeBtn);
      });

      // Play CTA -> start video, then reveal Play/Pause AND Restart Video
      playCTA.addEventListener('click', () => {
        video.play().then(() => {
          hide(playCTA);
          show(playBtnP1);
          show(restartVideoBtn);   // appears only after video started
          updateP1();
        }).catch(()=>{});
      });

      // Toggle play/pause; if this starts playback, also show Restart
      document.getElementById('togglePlayPauseBtn_p1').addEventListener('click', () => {
        const wasPaused = video.paused;
        if (wasPaused) {
          video.play().then(()=>{ show(restartVideoBtn); }).catch(()=>{});
        } else {
          video.pause();
        }
        updateP1();
      });

      restartVideoBtn.addEventListener('click', () => {
        video.pause();
        video.currentTime = 0;
        video.play().catch(()=>{});
        updateP1();
      });

      /* ===== Poster 2 (Model + voiceover + gestures + Reset) ===== */
      targetP2.addEventListener('targetFound', () => {
        // Model shows automatically at your chosen position (0 -0.85 0.05)
        modelRig.setAttribute('visible', true);

        // Capture defaults on first detection (so Reset returns to these)
        if (!defaultRigScale) defaultRigScale = modelRig.object3D.scale.clone();
        if (!defaultRigRot)   defaultRigRot   = modelRig.object3D.rotation.clone();

        // Show P2 voiceover controls and Reset pill
        show(tellCTA);
        hide(playBtnP2);       // Play/Pause appears after Tell me more
        hide(restartVoiceBtn); // appears only after voice started
        show(resetModelBtn);
        show(closeBtn);

        // Hide Poster 1 UI
        hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
      });

      targetP2.addEventListener('targetLost', () => {
        // Stop voiceover and hide P2 UI
        voice.pause();
        voice.currentTime = 0;

        modelRig.setAttribute('visible', false);
        hide(tellCTA); hide(playBtnP2); hide(restartVoiceBtn); hide(resetModelBtn);
        hide(closeBtn);
      });

      // Tell me more => start voiceover, swap to Play/Pause, show Restart Audio
      tellCTA.addEventListener('click', () => {
        voice.play().then(() => {
          hide(tellCTA);
          show(playBtnP2);
          show(restartVoiceBtn);   // appears only after voice started
          updateP2();
        }).catch(()=>{});
      });

      // Play/Pause for voiceover; if this starts playback, also show Restart
      const updateP2 = () => {
        const paused = voice.paused;
        iconPlayP2.style.display = paused ? 'block' : 'none';
        iconPauseP2.style.display = paused ? 'none' : 'block';
      };
      playBtnP2.addEventListener('click', () => {
        const wasPaused = voice.paused;
        if (wasPaused) {
          voice.play().then(()=>{ show(restartVoiceBtn); }).catch(()=>{});
        } else {
          voice.pause();
        }
        updateP2();
      });

      // Restart Audio pill (shows only after voice has started)
      restartVoiceBtn.addEventListener('click', () => {
        voice.pause();
        voice.currentTime = 0;
        voice.play().catch(()=>{});
        updateP2();
      });

      // Reset model (restores captured scale & rotation)
      document.getElementById('resetModelBtn_p2').addEventListener('click', () => {
        if (defaultRigScale && defaultRigRot) {
          modelRig.object3D.scale.copy(defaultRigScale);
          modelRig.object3D.rotation.set(defaultRigRot.x, defaultRigRot.y, defaultRigRot.z);
        }
      });

      /* Close: hides whichever is active */
      closeBtn.addEventListener('click', () => {
        // Poster 1
        video.pause(); video.currentTime = 0;
        arVideo.setAttribute('visible', false);
        hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);

        // Poster 2
        voice.pause(); voice.currentTime = 0;
        modelRig.setAttribute('visible', false);
        hide(tellCTA); hide(playBtnP2); hide(restartVoiceBtn); hide(resetModelBtn);

        hide(closeBtn);
      });

      /* INIT UI */
      hide(playCTA); hide(playBtnP1); hide(restartVideoBtn);
      hide(tellCTA); hide(playBtnP2); hide(restartVoiceBtn); hide(resetModelBtn);
      hide(closeBtn);
    };
  </script>

</body>
</html>
