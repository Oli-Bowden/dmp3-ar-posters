<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DMP3 AR Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />

  <!-- A-Frame + MindAR (correct script tags) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    .hidden { display: none !important; }
    canvas.a-canvas, .a-canvas { touch-action: none !important; }

    /* Poster 1 UI */
    .btn {
      position: fixed; bottom: 20px; left: 20px;
      width: 70px; height: 70px; border-radius: 50%;
      background: #1e5df8; color: #fff;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      cursor: pointer; z-index: 1000; user-select: none; pointer-events: auto;
    }
    .btn svg { width: 34px; height: 34px; fill: #fff; }
    .btn:active { transform: scale(0.96); }

    .cta-pill {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px;
      background: #1e5df8; color: #fff; border-radius: 30px;
      padding: 14px 22px; font-size: 16px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      z-index: 1000; cursor: pointer; pointer-events: auto; user-select: none;
      white-space: nowrap;
    }

    #restartVideoBtn_p1 {
      position: fixed; top: 20px; left: 20px;
      background: #1e5df8; color: #fff; border-radius: 30px;
      padding: 10px 14px; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(30,93,248,0.35);
      z-index: 1000; cursor: pointer; pointer-events: auto; user-select: none;
    }

    #closeBtn {
      position: fixed; top: 20px; right: 20px;
      width: 55px; height: 55px; line-height: 55px; text-align: center;
      background: rgba(0,0,0,0.7); color: #fff; border-radius: 50%;
      font-size: 26px; z-index: 1000; cursor: pointer; pointer-events: auto;
    }

    #audioOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 22px; z-index: 2000; cursor: pointer; user-select: none; text-align: center;
      padding: 24px;
    }
  </style>
</head>

<body>

  <!-- =================== AR SCENE =================== -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true">

    <a-assets timeout="45000">
      <!-- Poster 1 video -->
      <video id="videoAsset"
             src="./assets/video.mp4"
             preload="auto"
             playsinline
             crossorigin="anonymous"></video>

      <!-- Poster 2 model -->
      <a-asset-item id="modelAsset"
                    src="./assets/quantum-model-shaded.glb"
                    crossorigin="anonymous"></a-asset-item>
    </a-assets>

    <!-- Simple lights (helps PBR on mobile) -->
    <a-entity light="type: ambient; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; intensity: 1.1; position: 0 1 1"></a-entity>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Poster 1 -->
    <a-entity mindar-image-target="targetIndex: 0" id="targetP1">
      <a-video id="arVideo"
               src="#videoAsset"
               width="1.6"
               height="0.9"
               position="0 0 0"
               visible="false"></a-video>
    </a-entity>

    <!-- Poster 2 (auto show model, scalable + rotatable) -->
    <a-entity mindar-image-target="targetIndex: 1" id="targetP2">
      <a-entity id="modelRig"
                position="0 -0.05 0.06"
                rotation="0 0 0"
                scale="0.7 0.7 0.7"
                visible="false"
                touch-transform="minScale:0.2; maxScale:3; rotateFactor:0.01">
        <a-entity id="modelEntity" gltf-model="#modelAsset"></a-entity>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- =================== UI (Poster 1 only) =================== -->
  <div id="playVideoCTA_p1" class="cta-pill hidden">Play video</div>
  <div id="restartVideoBtn_p1" class="hidden">Restart video</div>

  <div id="togglePlayPauseBtn_p1" class="btn hidden" role="button" aria-label="Play/Pause video">
    <svg id="iconPlay_p1" viewBox="0 0 100 100"><polygon points="30,20 80,50 30,80"></polygon></svg>
    <svg id="iconPause_p1" viewBox="0 0 100 100" style="display:none;">
      <rect x="25" y="20" width="18" height="60"></rect>
      <rect x="57" y="20" width="18" height="60"></rect>
    </svg>
  </div>

  <div id="closeBtn" class="hidden">✕</div>
  <div id="audioOverlay">Tap to Enable Sound</div>

  <!-- =================== SCRIPT =================== -->
  <script>
    /******** Touch gestures: 1-finger rotate, 2-finger pinch to scale ********/
    AFRAME.registerComponent('touch-transform', {
      schema: { rotateFactor: {default: 0.01}, minScale: {default: 0.2}, maxScale: {default: 3} },
      init () {
        this.dragging = false;
        this.prevX = 0; this.prevY = 0;
        this.pinchStartDist = null;
        this.startScale = this.el.object3D.scale.x;

        // Bind handlers
        this._onStart = e => this._start(e);
        this._onMove  = e => this._move(e);
        this._onEnd   = e => this._end(e);

        window.addEventListener('touchstart', this._onStart, {passive:false});
        window.addEventListener('touchmove',  this._onMove,  {passive:false});
        window.addEventListener('touchend',   this._onEnd,   {passive:false});
        window.addEventListener('touchcancel',this._onEnd,   {passive:false});
      },
      remove(){
        window.removeEventListener('touchstart', this._onStart);
        window.removeEventListener('touchmove',  this._onMove);
        window.removeEventListener('touchend',   this._onEnd);
        window.removeEventListener('touchcancel',this._onEnd);
      },
      _visible(){ return this.el.object3D.visible; },
      _isUI(t){
        // Ignore gestures when touching UI controls
        return t && t.closest && t.closest('.btn, .cta-pill, #closeBtn, #audioOverlay, #restartVideoBtn_p1');
      },
      _dist(a,b){ return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); },

      _start(e){
        if (!this._visible() || this._isUI(e.target)) return;

        if (e.touches.length === 1){
          this.dragging = true;
          this.prevX = e.touches[0].clientX;
          this.prevY = e.touches[0].clientY;
          e.preventDefault();
        } else if (e.touches.length === 2){
          this.pinchStartDist = this._dist(e.touches[0], e.touches[1]);
          this.startScale = this.el.object3D.scale.x;
          e.preventDefault();
        }
      },

      _move(e){
        if (!this._visible() || this._isUI(e.target)) return;

        // Pinch scale
        if (e.touches.length === 2 && this.pinchStartDist){
          const d = this._dist(e.touches[0], e.touches[1]);
          let s = this.startScale * (d / this.pinchStartDist);
          s = Math.min(Math.max(s, this.data.minScale), this.data.maxScale);
          this.el.object3D.scale.set(s, s, s);
          e.preventDefault();
          return;
        }

        // One-finger rotate
        if (this.dragging && e.touches.length === 1){
          const x = e.touches[0].clientX, y = e.touches[0].clientY;
          const dx = x - this.prevX, dy = y - this.prevY;
          this.prevX = x; this.prevY = y;

          const r = this.el.object3D.rotation;
          r.y += dx * this.data.rotateFactor;  // yaw
          r.x += dy * this.data.rotateFactor;  // pitch
          // Clamp vertical tilt to ±90°
          const maxX = Math.PI / 2, minX = -Math.PI / 2;
          if (r.x > maxX) r.x = maxX;
          if (r.x < minX) r.x = minX;

          e.preventDefault();
        }
      },

      _end(e){
        if (!this._visible()) return;
        if (e.touches.length < 2){
          this.pinchStartDist = null;
          this.startScale = this.el.object3D.scale.x;
        }
        if (e.touches.length === 0){
          this.dragging = false;
        }
      }
    });

    /*************************** Main logic ***************************/
    window.onload = () => {
      /* ELEMENTS */
      const video = document.querySelector('#videoAsset');
      const arVideo = document.querySelector('#arVideo');

      const modelRig = document.querySelector('#modelRig');
      const modelEntity = document.querySelector('#modelEntity');

      const targetP1 = document.querySelector('#targetP1');
      const targetP2 = document.querySelector('#targetP2');

      const playCTA = document.getElementById('playVideoCTA_p1');
      const playBtnP1 = document.getElementById('togglePlayPauseBtn_p1');
      const iconPlayP1 = document.getElementById('iconPlay_p1');
      const iconPauseP1 = document.getElementById('iconPause_p1');

      const restartVideoBtn = document.getElementById('restartVideoBtn_p1');
      const closeBtn = document.getElementById('closeBtn');
      const audioOverlay = document.getElementById('audioOverlay');

      const show = el => el.classList.remove('hidden');
      const hide = el => el.classList.add('hidden');

      /* MODEL LOADED: recenter to pivot center */
      modelEntity.addEventListener('model-loaded', e => {
        const THREE = AFRAME.THREE;
        const obj = e.detail.model || modelEntity.getObject3D('mesh');

        if (obj) {
          try {
            const box = new THREE.Box3().setFromObject(obj);
            if (!box.isEmpty()){
              const center = new THREE.Vector3();
              box.getCenter(center);
              obj.position.sub(center);  // rotate around model center
            }
          } catch (err) {
            console.warn('[Model] recenter skipped:', err);
          }
        }
        // Note: visibility is handled by targetFound/targetLost
      });

      modelEntity.addEventListener('model-error', (e) => {
        console.error('[MODEL ERROR]', e.detail);
      });

      /* AUDIO UNLOCK (Poster 1 video) */
      audioOverlay.addEventListener('click', () => {
        video.muted = false;
        video.play().then(()=>video.pause()).catch(()=>{});
        audioOverlay.style.display = 'none';
      });

      /* ===== Poster 1 (Video) ===== */
      const updateP1 = () => {
        const paused = video.paused;
        iconPlayP1.style.display = paused ? 'block' : 'none';
        iconPauseP1.style.display = paused ? 'none' : 'block';
      };

      targetP1.addEventListener('targetFound', () => {
        arVideo.setAttribute('visible', true);
        show(playCTA);
        hide(playBtnP1);
        show(restartVideoBtn);
        show(closeBtn);
      });

      targetP1.addEventListener('targetLost', () => {
        video.pause();
        arVideo.setAttribute('visible', false);
        hide(playCTA);
        hide(playBtnP1);
        hide(restartVideoBtn);
        hide(closeBtn);
      });

      playCTA.addEventListener('click', () => {
        video.play().then(() => {
          hide(playCTA);
          show(playBtnP1);
          updateP1();
        }).catch(()=>{});
      });

      document.getElementById('togglePlayPauseBtn_p1').addEventListener('click', () => {
        if (video.paused) video.play().catch(()=>{});
        else video.pause();
        updateP1();
      });

      restartVideoBtn.addEventListener('click', () => {
        video.pause();
        video.currentTime = 0;
        video.play().catch(()=>{});
        updateP1();
      });

      /* ===== Poster 2 (Model auto-show) ===== */
      targetP2.addEventListener('targetFound', () => {
        modelRig.setAttribute('visible', true);
      });

      targetP2.addEventListener('targetLost', () => {
        modelRig.setAttribute('visible', false);
      });

      /* INIT UI */
      hide(playCTA); hide(playBtnP1); hide(restartVideoBtn); hide(closeBtn);
    };
  </script>

</body>
</html>
